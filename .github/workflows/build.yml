name: Build HK VPN Suite

on:
  push:
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s server/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: hk-vpn-server
          path: |
            server
            docs
            README.md

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: hk-vpn-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish HKVpnClient/HKVpnClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: hk-vpn-windows
          path: windows/publish
